name: Build Payload

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target profile (e.g., a54x-...)'
        required: true
        type: string
      release:
        description: 'Build release payload'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build payload
        run: |
          if [ "${{ inputs.release }}" = "true" ]; then
            make TARGET="${{ inputs.target }}" ANDROID_NDK_HOME="$ANDROID_NDK_HOME" release
          else
            make TARGET="${{ inputs.target }}" ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payload-${{ inputs.target }}
          path: build/${{ inputs.target }}/*
          if-no-files-found: error
